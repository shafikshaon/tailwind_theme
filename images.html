<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#faf5ff',
                            100: '#f3e8ff',
                            200: '#e9d5ff',
                            300: '#d8b4fe',
                            400: '#c084fc',
                            500: '#a855f7',
                            600: '#9333ea',
                            700: '#7e22ce',
                            800: '#6b21a8',
                            900: '#581c87',
                        }
                    }
                }
            }
        }
    </script>

<body class="bg-gray-50 antialiased">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="container mx-auto px-4 py-4">
            <a href="index.html" class="inline-flex items-center text-purple-600 hover:text-purple-700 font-medium">

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <section id="images" class="mb-16">
                <div class="bg-white rounded-lg shadow-sm p-6 border border-gray-200">
                    <h2 class="text-3xl font-bold text-gray-900 mb-2">Images & Avatars</h2>
                    <p class="text-gray-600 mb-6">Image components, avatars, and thumbnails</p>

                    <!-- Avatars -->
                    <div class="mb-8">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">Avatars (Various Sizes)</h3>
                        <div class="flex flex-wrap items-center gap-4">
                            <div class="h-8 w-8 rounded-full bg-purple-600 flex items-center justify-center text-white text-xs font-semibold">XS</div>
                            <div class="h-10 w-10 rounded-full bg-purple-600 flex items-center justify-center text-white text-sm font-semibold">SM</div>
                            <div class="h-12 w-12 rounded-full bg-purple-600 flex items-center justify-center text-white font-semibold">MD</div>
                            <div class="h-16 w-16 rounded-full bg-purple-600 flex items-center justify-center text-white text-lg font-semibold">LG</div>
                            <div class="h-20 w-20 rounded-full bg-purple-600 flex items-center justify-center text-white text-xl font-semibold">XL</div>
                        </div>
                    </div>

                    <!-- Avatar Group -->
                    <div class="mb-8">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">Avatar Group (Stacked)</h3>
                        <div class="flex -space-x-2">
                            <div class="h-10 w-10 rounded-full bg-purple-600 border-2 border-white flex items-center justify-center text-white text-sm font-semibold">JD</div>
                            <div class="h-10 w-10 rounded-full bg-blue-600 border-2 border-white flex items-center justify-center text-white text-sm font-semibold">SM</div>
                            <div class="h-10 w-10 rounded-full bg-green-600 border-2 border-white flex items-center justify-center text-white text-sm font-semibold">AK</div>
                            <div class="h-10 w-10 rounded-full bg-gray-600 border-2 border-white flex items-center justify-center text-white text-sm font-semibold">+5</div>
                        </div>
                    </div>

                    <!-- Rounded Images -->
                    <div class="mb-8">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">Rounded Images</h3>
                        <div class="flex flex-wrap gap-4">
                            <div class="h-24 w-24 bg-gray-300 rounded flex items-center justify-center text-gray-600 text-sm">Square</div>
                            <div class="h-24 w-24 bg-gray-300 rounded-lg flex items-center justify-center text-gray-600 text-sm">Rounded</div>
                            <div class="h-24 w-24 bg-gray-300 rounded-full flex items-center justify-center text-gray-600 text-sm">Circle</div>
                        </div>
                    </div>

                    <!-- Image Thumbnails -->
                    <div>
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">Image Thumbnails</h3>
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                            <div class="aspect-square bg-gray-300 rounded-lg flex items-center justify-center text-gray-600">
                                <svg class="h-12 w-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                </svg>
                            </div>
                            <div class="aspect-square bg-gray-300 rounded-lg flex items-center justify-center text-gray-600">
                                <svg class="h-12 w-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                </svg>
                            </div>
                            <div class="aspect-square bg-gray-300 rounded-lg flex items-center justify-center text-gray-600">
                                <svg class="h-12 w-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                </svg>
                            </div>
                            <div class="aspect-square bg-gray-300 rounded-lg flex items-center justify-center text-gray-600">
                                <svg class="h-12 w-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-6 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p class="text-gray-400 text-sm">Dashboard Component Library &copy; 2025</p>
        </div>
    </footer>

</html>
