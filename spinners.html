<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinners & Loaders - Dashboard Component Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#faf5ff',
                            100: '#f3e8ff',
                            200: '#e9d5ff',
                            300: '#d8b4fe',
                            400: '#c084fc',
                            500: '#a855f7',
                            600: '#9333ea',
                            700: '#7e22ce',
                            800: '#6b21a8',
                            900: '#581c87',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 antialiased">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="container mx-auto px-4 py-4">
            <a href="index.html" class="inline-flex items-center text-purple-600 hover:text-purple-700 font-medium">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                Back to Components
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <section id="spinners" class="mb-16">
                <div class="bg-white rounded-lg shadow-sm p-6 border border-gray-200">
                    <h2 class="text-3xl font-bold text-gray-900 mb-2">Spinners & Loaders</h2>
                    <p class="text-gray-600 mb-6">Loading indicators and spinners</p>

                    <!-- Circle Spinners -->
                    <div class="mb-8">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">Circle Spinners</h3>
                        <div class="flex flex-wrap items-center gap-8">
                            <div class="animate-spin h-8 w-8 border-4 border-purple-600 border-t-transparent rounded-full"></div>
                            <div class="animate-spin h-10 w-10 border-4 border-purple-600 border-t-transparent rounded-full"></div>
                            <div class="animate-spin h-12 w-12 border-4 border-purple-600 border-t-transparent rounded-full"></div>
                            <div class="animate-spin h-16 w-16 border-4 border-gray-300 border-t-purple-600 rounded-full"></div>
                        </div>
                    </div>

                    <!-- Dots Loader -->
                    <div class="mb-8">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">Dots Loader</h3>
                        <div class="flex gap-2">
                            <div class="h-3 w-3 bg-purple-600 rounded-full animate-bounce" style="animation-delay: 0ms"></div>
                            <div class="h-3 w-3 bg-purple-600 rounded-full animate-bounce" style="animation-delay: 150ms"></div>
                            <div class="h-3 w-3 bg-purple-600 rounded-full animate-bounce" style="animation-delay: 300ms"></div>
                        </div>
                    </div>

                    <!-- Progress Bars -->
                    <div class="mb-8">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">Progress Bars</h3>
                        <div class="space-y-4">
                            <div>
                                <div class="flex justify-between mb-1">
                                    <span class="text-sm font-medium text-gray-700">Progress</span>
                                    <span class="text-sm font-medium text-gray-700">45%</span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-2">
                                    <div class="bg-purple-600 h-2 rounded-full" style="width: 45%"></div>
                                </div>
                            </div>
                            <div>
                                <div class="flex justify-between mb-1">
                                    <span class="text-sm font-medium text-gray-700">Uploading</span>
                                    <span class="text-sm font-medium text-gray-700">75%</span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-2">
                                    <div class="bg-green-600 h-2 rounded-full" style="width: 75%"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Skeleton Screens -->
                    <div>
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">Skeleton Screens</h3>
                        <div class="border border-gray-200 rounded-lg p-4 max-w-sm">
                            <div class="animate-pulse">
                                <div class="h-4 bg-gray-300 rounded w-3/4 mb-4"></div>
                                <div class="h-3 bg-gray-300 rounded w-full mb-2"></div>
                                <div class="h-3 bg-gray-300 rounded w-5/6"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-6 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p class="text-gray-400 text-sm">Dashboard Component Library &copy; 2025</p>
        </div>
    </footer>
</body>
</html>
